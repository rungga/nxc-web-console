name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript
        run: |
          node --check frontend/static/js/app.js
          node --check frontend/static/js/api.js

      - name: Check launcher scripts
        run: bash -n run.sh bin/nxc-lima